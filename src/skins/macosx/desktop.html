<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' file:; frame-src 'self' file: https:; script-src 'self' 'unsafe-inline' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: file: blob: https:; font-src 'self' data: file:;">
<title>Mac OS X — Aqua</title>
<link rel="stylesheet" href="./desktop.css">
<link rel="stylesheet" href="../shared/cursors-mac.css">
<link rel="stylesheet" href="../../components/SharedApps/apps-theme.css">
</head>
<body>

  <!-- Startup screen (Mac OS X boot) -->
  <div id="boot-screen" aria-hidden="true">
    <div class="boot-apple">
      <svg viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
        <path fill="#ffffff" d="M44.6 22.2c-3.1-3.7-7.9-5.9-12.6-5.9-6.3 0-9.1 3-12.6 3s-6.7-3-12.6-3c-5.7 0-11.8 3.9-15.3 10.3-5 9.1-2.4 22.4 3.9 31.9 3.6 5.4 7.6 8.7 12.1 8.7 4.7 0 6.9-3 12.6-3s7.9 3 12.6 3c4.5 0 8.5-3.3 12.1-8.7 3.9-5.8 5.4-11.9 5.6-12.5-8.3-4-9.4-15.5-5.8-23.8z"/>
      </svg>
    </div>
    <div class="boot-spinner"></div>
  </div>
  <button id="boot-recovery" type="button"
    style="display:none;position:fixed;right:16px;bottom:16px;z-index:1000000;padding:10px 14px;border:1px solid #777;border-radius:8px;background:linear-gradient(#fff,#ddd);color:#222;font:13px 'Lucida Grande',Arial,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;">
    Startup stalled — switch era (F8)
  </button>

  <!-- Global menu bar -->
  <div id="menubar">
    <div class="mb-left">
      <span class="mb-apple" id="mb-apple" title="Apple menu"></span>
      <span class="mb-app-name" id="mb-app-name">Finder</span>
    </div>
    <div class="mb-menus" id="mb-menus"></div>
    <div class="mb-right">
      <span class="mb-extra" id="mb-extra"></span>
      <span class="mb-clock" id="mb-clock"></span>
    </div>
  </div>

  <!-- Desktop -->
  <div id="desktop">
    <div id="desktop-icons"></div>
    <div id="windows"></div>
  </div>

  <!-- Dock -->
  <div id="dock-wrap">
    <div id="dock"></div>
  </div>

  <script src="../../components/RealTaskbar/real-taskbar.js"></script>
  <script src="./desktop.js"></script>
  <script src="./finder.js"></script>
  <script src="./apps.js"></script>
  <script>
    // Desktop Time Machine — mount the REAL Windows desktop mirror.
    (function () {
      try {
        var DTM = window.parent && window.parent.DTM;
        var desktop = document.getElementById('desktop');
        if (DTM && DTM.mountDesktop && desktop) {
          DTM.mountDesktop({ desktop: desktop, skinId: 'macosx' });
        }
      } catch (e) { console.warn('[DTM] macosx mirror mount failed:', e); }
    })();
  </script>
  <script>
    (() => {
      const boot = document.getElementById('boot-screen');
      const recovery = document.getElementById('boot-recovery');
      const openSwitcher = () => window.parent.postMessage('dtm:open-switcher', '*');
      recovery.addEventListener('click', openSwitcher);
      document.addEventListener('keydown', (event) => {
        if (event.key === 'F8' || (event.ctrlKey && event.shiftKey && event.key.toLowerCase() === 't')) {
          event.preventDefault();
          openSwitcher();
        }
      });
      // Missing or stalled skin scripts must not trap users behind the boot screen.
      window.setTimeout(() => {
        if (boot && !boot.classList.contains('done')) {
          boot.classList.add('done');
          boot.setAttribute('aria-hidden', 'true');
          recovery.style.display = 'block';
        }
      }, 5000);
    })();
  </script>
<!-- Shared application ecosystem: one implementation, era-specific presentation -->
<script src="../../components/SharedApps/app-framework.js"></script>
<script src="../../components/SharedApps/apps-core.js"></script>
<script>if (window.DTMApps) window.DTMApps.configure({ skinId: 'macosx', theme: 'aqua' });</script>
</body>
</html>

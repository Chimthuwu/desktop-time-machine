<title>Windows 95 — Desktop Time Machine</title>
<style>
:root{--gray:#c0c0c0;--dark:#808080;--darker:#404040;--white:#fff;--navy:#000080;--blue:#1084d0}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Tahoma,Arial,sans-serif;font-size:12px;color:#000}
body{background:#008080;user-select:none}
button{font:inherit}
.desktop{position:relative;width:100%;height:100%;padding:12px 10px 42px;overflow-y:auto}

.desktop-icon{width:76px;height:82px;display:flex;align-items:center;flex-direction:column;gap:5px;padding:5px 2px;color:white;text-shadow:1px 1px #000;cursor:default;border:1px solid transparent}
.desktop-icon.selected{background:#000080;border:1px dotted #fff}
.glyph{font-size:31px;line-height:35px;text-shadow:none;filter:drop-shadow(1px 1px 0 #333)}
.desktop-icon span:last-child{text-align:center;line-height:14px}
.taskbar{position:absolute;bottom:0;left:0;right:0;height:38px;background:var(--gray);border-top:2px solid white;display:flex;align-items:center;padding:3px;gap:4px;z-index:10000;box-shadow:0 -1px #808080}
.start-button{height:30px;padding:2px 8px 2px 5px;font-weight:bold;display:flex;align-items:center;gap:5px}
.win95-button{background:var(--gray);border:2px solid;border-color:white #404040 #404040 white;box-shadow:inset 1px 1px #dfdfdf;min-height:24px;padding:2px 8px;cursor:pointer}
.win95-button:active,.win95-button.pressed{border-color:#404040 white white #404040;box-shadow:inset 1px 1px #808080}
.start-logo{font-size:20px}
.task-buttons{display:flex;gap:4px;flex:1;min-width:0;overflow:hidden}
.real-pinned{display:flex;align-items:center;gap:2px;padding:0 4px;border-left:1px solid #808080;border-right:1px solid #fff;height:29px;max-width:240px;overflow:hidden;flex:none}
.real-pinned:empty{display:none}

.window{position:absolute;width:min(520px,calc(100vw - 30px));height:350px;background:var(--gray);border:2px solid;border-color:white #404040 #404040 white;box-shadow:1px 1px 0 #000;z-index:10;display:flex;flex-direction:column;min-width:260px;min-height:150px}

/* MINESWEEPER CSS */
.ms-container { background: #c0c0c0; padding: 6px; display: flex; flex-direction: column; align-items: center; width: fit-content; margin: 10px auto; border: 3px solid; border-color: #fff #808080 #808080 #fff; }
.ms-header { background: #c0c0c0; border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 5px 8px; display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 6px; }
.ms-display { background: #000; color: #f00; font-family: 'Courier New', monospace; font-size: 20px; font-weight: bold; padding: 2px 4px; border: 1px solid #808080; letter-spacing: 2px; }
.ms-face { width: 26px; height: 26px; font-size: 20px; display: flex; align-items: center; justify-content: center; background: #c0c0c0; border: 2px solid; border-color: #fff #808080 #808080 #fff; cursor: pointer; user-select: none; }
.ms-face:active { border-color: #808080 #fff #fff #808080; }
.ms-grid { display: grid; border: 3px solid; border-color: #808080 #fff #fff #808080; background: #c0c0c0; }
.ms-cell { width: 16px; height: 16px; background: #c0c0c0; border: 2px solid; border-color: #fff #808080 #808080 #fff; display: flex; align-items: center; justify-content: center; font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; cursor: pointer; }
.ms-cell.revealed { border: 1px solid #808080; }
.ms-cell.mine-hit { background: #f00; }
.ms-cell.flag::after { content: '🚩'; font-size: 10px; }
.ms-cell.mine::after { content: '💣'; font-size: 10px; }
.ms-cell.c1 { color: blue; } .ms-cell.c2 { color: green; } .ms-cell.c3 { color: red; } .ms-cell.c4 { color: navy; } .ms-cell.c5 { color: maroon; } .ms-cell.c6 { color: teal; } .ms-cell.c7 { color: black; } .ms-cell.c8 { color: gray; }

@keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
.blink { animation: blink 1s step-start infinite; }
@media(max-width:600px){.window{width:calc(100vw - 20px)!important;left:10px!important}.icon-grid{grid-template-columns:70px}.desktop-icon{width:68px}.task-button{max-width:100px}}
</style>

<script>
(() => {
// Connect to DTM Shared Engine
const DTM = (window.parent && window.parent.DTM) ? window.parent.DTM : (window.DTM || null);

const desktop=document.getElementById('desktop'), menu=document.getElementById('startMenu'), taskButtons=document.getElementById('taskButtons');
let z=20, active=null, winCount=0, ssAnimId=null, ssOverlay=null;

// FORWARD HOTKEYS TO PARENT SHELL
window.addEventListener('keydown', (e) => {
  if (e.key === 'F8' || (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 't')) {
    e.preventDefault();
    if (window.parent) window.parent.postMessage('dtm:open-switcher', '*');
  }
});

// WEB BROWSER FUNCTIONS
window.ieGo = (win) => {
  const urlInput = win.querySelector('#ie-url');
  let url = urlInput.value.trim();
  if(!url.startsWith('http')) url = 'https://' + url;
  urlInput.value = url;
  win.querySelector('#ie-frame').src = url;
  win.querySelector('#ie-status').textContent = 'Loading ' + url + '...';
  setTimeout(()=> {
    const st = win.querySelector('#ie-status');
    if (st) st.textContent = 'Done';
  }, 1500);
};
window.ieBack = (win) => { try { win.querySelector('#ie-frame').contentWindow.history.back(); } catch(e){} };
window.ieForward = (win) => { try { win.querySelector('#ie-frame').contentWindow.history.forward(); } catch(e){} };
window.ieStop = (win) => { win.querySelector('#ie-frame').src = 'about:blank'; win.querySelector('#ie-status').textContent = 'Stopped'; };
window.ieRefresh = (win) => { win.querySelector('#ie-frame').src = win.querySelector('#ie-url').value; };
window.ieOpenExternal = (win) => {
  const url = win.querySelector('#ie-url').value;
  if (DTM && DTM.system.openExternalUrl) {
    DTM.system.openExternalUrl(url).catch(e => alert('Error opening URL: ' + e.message));
  } else {
    window.open(url, '_blank');
  }
};

// MINESWEEPER LOGIC
function setupMinesweeper(w) {
  const gridEl = w.querySelector('.ms-grid');
  const mineCountEl = w.querySelector('#ms-mines');
  const timerEl = w.querySelector('#ms-timer');
  const faceEl = w.querySelector('.ms-face');
  
  const ROWS = 9, COLS = 9, MINES = 10;
  let board = [];
  let gameState = 'ready'; // ready, playing, won, lost
  let flags = 0;
  let revealedCount = 0;
  let timerId = null;
  let time = 0;

  function initBoard() {
    board = [];
    for (let r = 0; r < ROWS; r++) {
      let row = [];
      for (let c = 0; c < COLS; c++) {
        row.push({ isMine: false, isRevealed: false, isFlagged: false, neighbors: 0 });
      }
      board.push(row);
    }
    gameState = 'ready';
    flags = 0;
    revealedCount = 0;
    time = 0;
    clearInterval(timerId);
    timerEl.textContent = '000';
    mineCountEl.textContent = '010';
    faceEl.textContent = '🙂';
    gridEl.style.gridTemplateColumns = `repeat(${COLS}, 16px)`;
    gridEl.innerHTML = '';
    
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cell = document.createElement('div');
        cell.className = 'ms-cell';
        cell.dataset.r = r;
        cell.dataset.c = c;
        cell.addEventListener('mousedown', (e) => handleClick(e, r, c));
        cell.addEventListener('contextmenu', (e) => { e.preventDefault(); handleRightClick(r, c); });
        gridEl.appendChild(cell);
      }
    }
  }

  function placeMines(safeR, safeC) {
    let minesPlaced = 0;
    while (minesPlaced < MINES) {
      const r = Math.floor(Math.random() * ROWS);
      const c = Math.floor(Math.random() * COLS);
      if (!board[r][c].isMine && (Math.abs(r - safeR) > 1 || Math.abs(c - safeC) > 1)) {
        board[r][c].isMine = true;
        minesPlaced++;
      }
    }
    
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (board[r][c].isMine) continue;
        let count = 0;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (r+dr >= 0 && r+dr < ROWS && c+dc >= 0 && c+dc < COLS && board[r+dr][c+dc].isMine) count++;
          }
        }
        board[r][c].neighbors = count;
      }
    }
  }

  function handleClick(e, r, c) {
    if (gameState === 'won' || gameState === 'lost' || e.button !== 0) return;
    
    if (gameState === 'ready') {
      gameState = 'playing';
      placeMines(r, c);
      timerId = setInterval(() => { time++; timerEl.textContent = String(time).padStart(3, '0').slice(-3); }, 1000);
    }
    
    const cellData = board[r][c];
    if (cellData.isFlagged || cellData.isRevealed) return;
    
    if (cellData.isMine) {
      gameState = 'lost';
      clearInterval(timerId);
      faceEl.textContent = '💀';
      revealAll(r, c);
      return;
    }
    
    revealCell(r, c);
    checkWin();
  }

  function handleRightClick(r, c) {
    if (gameState === 'won' || gameState === 'lost') return;
    const cellData = board[r][c];
    if (cellData.isRevealed) return;
    
    if (!cellData.isFlagged && flags < MINES) {
      cellData.isFlagged = true;
      flags++;
    } else if (cellData.isFlagged) {
      cellData.isFlagged = false;
      flags--;
    }
    
    mineCountEl.textContent = String(MINES - flags).padStart(3, '0');
    updateUI();
  }

  function revealCell(r, c) {
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
    const cellData = board[r][c];
    if (cellData.isRevealed || cellData.isFlagged) return;
    
    cellData.isRevealed = true;
    revealedCount++;
    
    if (cellData.neighbors === 0 && !cellData.isMine) {
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (dr !== 0 || dc !== 0) revealCell(r + dr, c + dc);
        }
      }
    }
    updateUI();
  }

  function updateUI() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cellData = board[r][c];
        const el = gridEl.children[r * COLS + c];
        
        if (cellData.isRevealed) {
          el.classList.add('revealed');
          if (cellData.isMine) {
            el.classList.add('mine');
          } else if (cellData.neighbors > 0) {
            el.textContent = cellData.neighbors;
            el.classList.add('c' + cellData.neighbors);
          }
        } else if (cellData.isFlagged) {
          el.classList.add('flag');
        }
      }
    }
  }

  function revealAll(hitR, hitC) {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const cellData = board[r][c];
        if (cellData.isMine) cellData.isRevealed = true;
      }
    }
    updateUI();
    if (hitR !== undefined) gridEl.children[hitR * COLS + hitC].classList.add('mine-hit');
  }

  function checkWin() {
    if (revealedCount === (ROWS * COLS) - MINES) {
      gameState = 'won';
      clearInterval(timerId);
      faceEl.textContent = '😎';
      mineCountEl.textContent = '000';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c].isMine) board[r][c].isFlagged = true;
        }
      }
      updateUI();
    }
  }

  faceEl.addEventListener('click', initBoard);
  initBoard();
}

// In-skin modal prompt — Electron renderers do not support window.prompt().
function hostPrompt(title, message, defaultValue) {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:100200;display:flex;align-items:center;justify-content:center;';
    const dlg = document.createElement('div');
    dlg.style.cssText = 'width:340px;background:#c0c0c0;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:2px 2px 0 #000;font-family:MS Sans Serif,Tahoma,sans-serif;font-size:11px;';
    const bar = document.createElement('div');
    bar.style.cssText = 'padding:4px 8px;font-weight:bold;color:#fff;background:linear-gradient(90deg,#000080,#1084d0);border-bottom:1px solid #000;';
    bar.textContent = title;
    const body = document.createElement('div');
    body.style.cssText = 'padding:12px;';
    const label = document.createElement('div');
    label.style.cssText = 'margin-bottom:6px;';
    label.textContent = message;
    const input = document.createElement('input');
    input.className = 'hostprompt-input';
    input.style.cssText = 'width:100%;box-sizing:border-box;padding:3px 5px;font-family:Tahoma;font-size:11px;border:2px inset #fff;';
    input.value = defaultValue || '';
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;justify-content:flex-end;gap:6px;margin-top:12px;';
    const mkBtn = (text, cls) => {
      const b = document.createElement('button');
      b.textContent = text;
      b.className = cls;
      b.style.cssText = 'min-width:70px;padding:3px 10px;border:2px solid;border-color:#fff #404040 #404040 #fff;background:#c0c0c0;font-family:Tahoma;font-size:11px;';
      return b;
    };
    const ok = mkBtn('OK', 'hostprompt-ok');
    const cancel = mkBtn('Cancel', 'hostprompt-cancel');
    row.append(ok, cancel);
    body.append(label, input, row);
    dlg.append(bar, body);
    overlay.appendChild(dlg);
    document.body.appendChild(overlay);
    const done = (val) => { overlay.remove(); resolve(val); };
    ok.addEventListener('click', () => done(input.value.trim()));
    cancel.addEventListener('click', () => done(null));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') done(input.value.trim());
      if (e.key === 'Escape') done(null);
    });
    overlay.addEventListener('pointerdown', (e) => { if (e.target === overlay) done(null); });
    setTimeout(() => { input.focus(); input.select(); }, 30);
  });
}

// REAL FILESYSTEM EXPLORER (shared engine.fs backend)
async function fsList(target) {
  if (DTM && DTM.fs && DTM.fs.list) {
    const result = await DTM.fs.list(target);
    return {
      currentPath: result.path,
      parentPath: result.parentPath,
      items: result.items,
      truncated: result.truncated
    };
  }
  return DTM.system.listDirectory(target);
}

function setupExplorer(win, initialPath) {
  let currentPath = initialPath || '';
  let selected = null;
  const grid = win.querySelector('.explorer-grid');
  const pathInput = win.querySelector('#exp-path');
  const statusEl = win.querySelector('#exp-status');

  async function loadPath(target) {
    if (!DTM) {
      grid.innerHTML = '<div style="padding:15px;">System Integration active in Electron mode.</div>';
      return;
    }
    grid.innerHTML = '<div style="padding:15px;">Reading directory...</div>';
    try {
      const result = await fsList(target);
      currentPath = result.currentPath;
      pathInput.value = currentPath;
      grid.innerHTML = '';
      selected = null;

      if (result.parentPath) {
        const upItem = document.createElement('div');
        upItem.className = 'explorer-item';
        upItem.innerHTML = `<span class="glyph">📁</span><span>.. (Up)</span>`;
        upItem.addEventListener('dblclick', () => loadPath(result.parentPath));
        grid.appendChild(upItem);
      }

      result.items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'explorer-item';
        const icon = item.isDirectory ? '📁' : '📄';
        el.innerHTML = `<span class="glyph">${icon}</span><span></span>`;
        el.querySelector('span:last-child').textContent = item.name;
        el.title = `${item.name}\n${item.isDirectory ? 'Folder' : (item.size ? Math.round(item.size/1024) + ' KB' : 'File')}`;

        el.addEventListener('click', (e) => {
          e.stopPropagation();
          grid.querySelectorAll('.explorer-item').forEach(i => i.classList.remove('selected'));
          el.classList.add('selected');
          selected = item;
        });

        el.addEventListener('dblclick', () => {
          if (item.isDirectory) {
            loadPath(item.path);
          } else {
            DTM.system.openPath(item.path).catch(err => alert('Could not open file: ' + err.message));
          }
        });

        grid.appendChild(el);
      });

      statusEl.textContent = `${result.items.length} object(s)${result.truncated ? ' (truncated)' : ''}`;
    } catch (err) {
      grid.innerHTML = `<div style="padding:15px;color:red;">Error: ${err.message}</div>`;
      statusEl.textContent = 'Error';
    }
  }

  function getSelected() {
    if (!selected) {
      alert('Select a file or folder first.');
      return null;
    }
    return selected;
  }

  const newFolderBtn = win.querySelector('#exp-newfolder');
  if (newFolderBtn) newFolderBtn.addEventListener('click', async () => {
    const name = await hostPrompt('New Folder', 'Name for the new folder:', 'New Folder');
    if (!name) return;
    try {
      await DTM.fs.mkdir(`${currentPath}\\${name}`);
      loadPath(currentPath);
    } catch (err) {
      alert('Could not create folder: ' + err.message);
    }
  });

  const renameBtn = win.querySelector('#exp-rename');
  if (renameBtn) renameBtn.addEventListener('click', async () => {
    const item = getSelected();
    if (!item) return;
    const name = await hostPrompt('Rename', 'Rename to:', item.name);
    if (!name || name === item.name) return;
    try {
      await DTM.fs.rename(item.path, name);
      loadPath(currentPath);
    } catch (err) {
      alert('Could not rename: ' + err.message);
    }
  });

  const deleteBtn = win.querySelector('#exp-delete');
  if (deleteBtn) deleteBtn.addEventListener('click', async () => {
    const item = getSelected();
    if (!item) return;
    if (!confirm(`Delete "${item.name}"?\n\nThis permanently removes it from the real host filesystem.`)) return;
    try {
      await DTM.fs.removeRecursive(item.path);
      loadPath(currentPath);
    } catch (err) {
      alert('Could not delete: ' + err.message);
    }
  });

  win.querySelector('#exp-up').addEventListener('click', () => {
    if (DTM) {
      const parent = currentPath.split(/[\\/\\]/).slice(0, -1).join('\\') || currentPath;
      loadPath(parent);
    }
  });

  win.querySelector('#exp-go').addEventListener('click', () => loadPath(pathInput.value));
  pathInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadPath(pathInput.value); });

  loadPath(currentPath);
}

// SCREENSAVER FUNCTIONS
function startScreensaver(type) {
  if(ssOverlay) return;
  ssOverlay=document.createElement('div');
  ssOverlay.style="position:fixed;inset:0;background:#000;z-index:999999;cursor:none;";
  const canvas=document.createElement('canvas');
  canvas.width=innerWidth; canvas.height=innerHeight;
  canvas.style="display:block;width:100%;height:100%;";
  ssOverlay.appendChild(canvas);
  document.body.appendChild(ssOverlay);
  const ctx=canvas.getContext('2d');
  
  const stop=()=>{
    cancelAnimationFrame(ssAnimId);
    ssOverlay.remove();
    ssOverlay=null;
    document.removeEventListener('pointerdown',stop);
    document.removeEventListener('keydown',stop);
  };
  document.addEventListener('pointerdown',stop);
  document.addEventListener('keydown',stop);

  if(type==='mystify'){
    let pts=[
      {x:canvas.width/2, y:canvas.height/2, dx:5, dy:3, c:'#ff0000'},
      {x:canvas.width/2, y:canvas.height/2, dx:-4, dy:6, c:'#00ff00'},
      {x:canvas.width/2, y:canvas.height/2, dx:6, dy:-5, c:'#0000ff'},
      {x:canvas.width/2, y:canvas.height/2, dx:-3, dy:-7, c:'#ffff00'}
    ];
    const draw=()=>{
      ctx.fillStyle='rgba(0,0,0,0.08)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.globalCompositeOperation='lighter';
      pts.forEach(p=>{
        p.x+=p.dx; p.y+=p.dy;
        if(p.x<0||p.x>canvas.width) p.dx*=-1;
        if(p.y<0||p.y>canvas.height) p.dy*=-1;
      });
      for(let i=0;i<pts.length;i++){
        for(let j=i+1;j<pts.length;j++){
          ctx.strokeStyle=pts[i].c;
          ctx.lineWidth=2;
          ctx.beginPath();
          ctx.moveTo(pts[i].x, pts[i].y);
          ctx.lineTo(pts[j].x, pts[j].y);
          ctx.stroke();
        }
      }
      ssAnimId=requestAnimationFrame(draw);
    };
    draw();
  } else if(type==='starfield'){
    const stars=Array.from({length:400},()=>({
      x:(Math.random()-0.5)*canvas.width,
      y:(Math.random()-0.5)*canvas.height,
      z:Math.random()*canvas.width
    }));
    const draw=()=>{
      ctx.fillStyle='black';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='white';
      stars.forEach(s=>{
        s.z-=15;
        if(s.z<=0){ s.x=(Math.random()-0.5)*canvas.width; s.y=(Math.random()-0.5)*canvas.height; s.z=canvas.width; }
        const x=s.x/s.z*canvas.width+canvas.width/2;
        const y=s.y/s.z*canvas.height+canvas.height/2;
        const size=(1-s.z/canvas.width)*4;
        ctx.fillRect(x,y,size,size);
      });
      ssAnimId=requestAnimationFrame(draw);
    };
    draw();
  }
}

// OPEN WINDOW LOGIC
function openApp(key){
 menu.classList.remove('open');
 if (key === 'timemachine') {
   if (window.parent) window.parent.postMessage('dtm:open-switcher', '*');
   return;
 }

 const app=apps[key];if(!app)return;
 const existing=document.querySelector(`.window[data-app="${key}"]`);
 if(existing){restore(existing);return}
 const w=document.createElement('section');w.className='window';w.dataset.app=key;w.style.width=app.width+'px';w.style.height=app.height+'px';
 w.style.left=Math.max(12,Math.min(innerWidth-app.width-15,100+winCount*24))+'px';
 w.style.top=Math.max(12,Math.min(innerHeight-app.height-60,65+winCount*20))+'px';winCount++;
 w.innerHTML=`<div class="titlebar"><span>${app.icon}</span><span class="win-title">${app.title}</span><div class="title-controls"><button class="win95-button" data-min>_</button><button class="win95-button" data-max>□</button><button class="win95-button" data-close>×</button></div></div><div class="window-body">${app.body()}</div>`;
 desktop.appendChild(w);makeTask(w);focus(w);
 w.addEventListener('pointerdown',()=>focus(w));
 w.querySelector('[data-close]').addEventListener('click',()=>close(w));
 w.querySelector('[data-min]').addEventListener('click',()=>minimize(w));
 w.querySelector('[data-max]').addEventListener('click',()=>{w.classList.toggle('maximized');focus(w)});
 drag(w);
 w.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{w.dataset.color=b.dataset.color}));
 const canvas=w.querySelector('canvas');if(canvas)setupPaint(canvas,w);
 
 if(key==='display'){
   w.querySelector('#ssPreview').addEventListener('click',()=>{
     startScreensaver(w.querySelector('#ssSelect').value);
   });
 }
 if(key==='minesweeper') {
   setupMinesweeper(w);
 }
 if(key==='explorer') {
   setupExplorer(w);
 }
 if(key==='shutdown') {
   const confirmBtn = w.querySelector('#shutdownConfirmBtn');
   if (confirmBtn) {
     confirmBtn.addEventListener('click', () => {
       const selected = w.querySelector('input[name="shutdown_opt"]:checked')?.value;
       if (selected === 'restart') {
         location.reload();
       } else if (selected === 'switcher') {
         close(w);
         if (window.parent) window.parent.postMessage('dtm:open-switcher', '*');
       } else {
         // Authentic classic shutdown screen with safe exit to Windows
         document.body.innerHTML = `
           <div style="background:#000;color:#e88000;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Tahoma;text-align:center;gap:20px;">
             <div style="font-size:24px;font-weight:bold;letter-spacing:1px;color:#d4af37;">It is now safe to turn off your computer.</div>
             <p style="color:#aaa;max-width:500px;line-height:1.5;">Desktop Time Machine has prepared the environment for shutdown.</p>
             <div style="display:flex;gap:12px;">
               <button class="win95-button" onclick="if(DTM)DTM.system.exit();else alert('Exiting');" style="padding:8px 20px;font-weight:bold;">Exit to Windows</button>
               <button class="win95-button" onclick="location.reload();" style="padding:8px 20px;">Restart Win95</button>
             </div>
           </div>`;
       }
     });
   }
 }
}

function makeTask(w){const b=document.createElement('button');b.className='win95-button task-button';b.textContent=apps[w.dataset.app].icon+' '+apps[w.dataset.app].title;b.addEventListener('click',()=>w.style.display==='none'?restore(w):w===active&&w.style.display!=='none'?minimize(w):focus(w));b.dataset.for=w.dataset.app;taskButtons.appendChild(b);w._task=b}
function focus(w){if(active&&active!==w){active.querySelector('.titlebar').classList.add('inactive');active._task?.classList.remove('pressed')}active=w;w.style.display='flex';w.style.zIndex=++z;w.querySelector('.titlebar').classList.remove('inactive');w._task?.classList.add('pressed')}
function minimize(w){w.style.display='none';w._task?.classList.remove('pressed');if(active===w)active=null}
function restore(w){w.style.display='flex';focus(w)}
function close(w){w._task?.remove();if(active===w)active=null;w.remove()}
function drag(w){const bar=w.querySelector('.titlebar');let ox=0,oy=0,moving=false;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||w.classList.contains('maximized'))return;moving=true;focus(w);ox=e.clientX-w.offsetLeft;oy=e.clientY-w.offsetTop;bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!moving)return;w.style.left=Math.max(0,Math.min(innerWidth-w.offsetWidth,e.clientX-ox))+'px';w.style.top=Math.max(0,Math.min(innerHeight-45,e.clientY-oy))+'px'});bar.addEventListener('pointerup',()=>moving=false);bar.addEventListener('pointercancel',()=>moving=false)}
function setupPaint(canvas,w){const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);let down=false;function pos(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height]}canvas.addEventListener('pointerdown',e=>{down=true;canvas.setPointerCapture(e.pointerId);const [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)});canvas.addEventListener('pointermove',e=>{if(!down)return;const [x,y]=pos(e);ctx.strokeStyle=w.dataset.color||'#000';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineTo(x,y);ctx.stroke()});canvas.addEventListener('pointerup',()=>down=false);canvas.addEventListener('pointercancel',()=>down=false)}

document.getElementById('startBtn').addEventListener('click',()=>menu.classList.toggle('open'));
document.querySelectorAll('.desktop-icon').forEach(icon=>{icon.addEventListener('click',()=>{document.querySelectorAll('.desktop-icon').forEach(i=>i.classList.remove('selected'));icon.classList.add('selected')});icon.addEventListener('dblclick',()=>{if(icon.dataset.app) openApp(icon.dataset.app); else alert('This is a folder. It is empty!')})});

// Tray Fullscreen Toggle
document.getElementById('trayArea').addEventListener('dblclick', () => {
  if (DTM && DTM.system.toggleFullScreen) {
    DTM.system.toggleFullScreen();
  }
});

menu.addEventListener('click',e=>{
  const item=e.target.closest('[data-launch]');
  if(!item)return;
  e.stopPropagation(); 
  const key=item.dataset.launch;
  
  if(key==='programs') return;
  else if(key==='timemachine') {
    menu.classList.remove('open');
    if (window.parent) window.parent.postMessage('dtm:open-switcher', '*');
  }
  else if(key==='shutdown') openApp('shutdown');
  else if(key==='help') openApp('help');
  else if(key==='documents') openApp('notepad');
  else if(key==='settings') openApp('display');
  else if(key==='find') openApp('explorer');
  else if(key==='run'){
    hostPrompt('Run', 'Type the name of a program to open in Win95 (or a real Windows program e.g. calc, notepad, mspaint):', 'notepad').then(v => {
      if(!v) return;
      const lower = v.toLowerCase().trim();
      if (lower === 'calc' || lower === 'calc.exe') {
        if (DTM && confirm('Launch real Windows Calculator?')) {
          DTM.system.launchProgram('calc.exe').catch(err => alert(err.message));
          return;
        }
      }
      openApp(lower.includes('paint')?'paint':lower.includes('display')?'display':lower.includes('mine')?'minesweeper':lower.includes('exp')?'explorer':'notepad');
    });
  }
  else if(apps[key]) openApp(key);
});

document.addEventListener('pointerdown',e=>{
  if(!menu.contains(e.target)&&!e.target.closest('#startBtn')) menu.classList.remove('open');
  if(!e.target.closest('.context')) document.querySelector('.context')?.remove();
});

document.addEventListener('contextmenu',e=>{
  if(e.target.closest('.window')||e.target.closest('.taskbar'))return;
  e.preventDefault();document.querySelector('.context')?.remove();
  const c=document.createElement('div');c.className='context';
  c.style.left=Math.min(e.clientX,innerWidth-170)+'px';
  c.style.top=Math.min(e.clientY,innerHeight-150)+'px';
  c.innerHTML=`
    <div data-c="timemachine">⏳ Time Machine</div>
    <div data-c="arrange">Arrange Icons</div>
    <div data-c="refresh">Refresh</div>
    <div data-c="new" style="position:relative;">New ▸
      <div class="submenu">
        <div data-c="folder">Folder</div>
        <div data-c="shortcut">Shortcut</div>
        <div data-c="text">Text Document</div>
      </div>
    </div>
    <div data-c="properties">Properties</div>`;
  desktop.appendChild(c);
  
  c.addEventListener('click',ev=>{
    const a=ev.target.dataset.c;
    if(a==='timemachine'){
      if (window.parent) window.parent.postMessage('dtm:open-switcher', '*');
    }
    if(a==='refresh'){document.querySelectorAll('.desktop-icon').forEach(i=>i.classList.remove('selected'))}
    if(a==='folder'){
      const newIcon=document.createElement('div');
      newIcon.className='desktop-icon';
      newIcon.innerHTML='<span class="glyph">📁</span><span>New Folder</span>';
      newIcon.addEventListener('click',()=>{document.querySelectorAll('.desktop-icon').forEach(i=>i.classList.remove('selected'));newIcon.classList.add('selected')});
      newIcon.addEventListener('dblclick',()=>alert('Folder is empty.'));
      document.getElementById('iconGrid').appendChild(newIcon);
    }
    if(a==='properties')openApp('display');
    if(a!=='new') c.remove();
  });
});

function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}tick();
const clockInterval = setInterval(tick,1000);
window.addEventListener('unload', () => {
  clearInterval(clockInterval);
  if (ssAnimId) {
    cancelAnimationFrame(ssAnimId);
    ssAnimId = null;
  }
  if (ssOverlay) {
    ssOverlay.remove();
    ssOverlay = null;
  }
});
window.openApp = openApp;

// REAL WINDOWS TASKBAR MIRROR — pinned apps, running windows, tray items.
function setupRealTaskbar() {
  const pinnedEl = document.getElementById('realPinned');
  const trayEl = document.getElementById('realTray');
  if (!pinnedEl || !trayEl || !DTM || !DTM.system || !DTM.system.getTaskbar) return;
  const state = { pinSig: null, traySig: null, busy: false };

  function clearRealTaskButtons() {
    taskButtons.querySelectorAll('.real-task').forEach(b => b.remove());
  }

  function renderPinned(pinned) {
    const list = pinned || [];
    const sig = list.map(p => p.path).join('|');
    if (sig === state.pinSig) return;
    state.pinSig = sig;
    pinnedEl.innerHTML = '';
    list.forEach(p => {
      const b = document.createElement('button');
      b.className = 'real-pin-btn';
      b.title = p.name + ' — pinned in your real Windows taskbar';
      if (p.icon) {
        const img = document.createElement('img');
        img.src = p.icon; img.alt = '';
        b.appendChild(img);
      } else {
        const s = document.createElement('span');
        s.className = 'real-pin-fallback';
        s.textContent = (p.name || '?').trim().charAt(0).toUpperCase();
        b.appendChild(s);
      }
      b.addEventListener('click', () => {
        DTM.system.openPath(p.path).catch(e => alert('Could not open ' + p.name + ': ' + e.message));
      });
      pinnedEl.appendChild(b);
    });
  }

  function renderWindows(windows) {
    clearRealTaskButtons();
    (windows || []).forEach(w => {
      const b = document.createElement('button');
      b.className = 'win95-button task-button real-task';
      b.title = w.title + (w.processName ? ' (' + w.processName + ')' : '') + ' — real Windows window';
      if (w.icon) {
        const img = document.createElement('img');
        img.src = w.icon; img.alt = '';
        b.appendChild(img);
      }
      const label = document.createElement('span');
      label.textContent = w.title;
      b.appendChild(label);
      b.addEventListener('click', () => {
        DTM.system.activateWindow(w.pid).catch(e => alert(e.message));
      });
      taskButtons.appendChild(b);
    });
  }

  function trayGlyph(name) {
    const n = String(name || '').toLowerCase();
    if (/network|internet|ethernet|wi-?fi|wlan/.test(n)) return '🌐';
    if (/volume|sound|audio|speaker/.test(n)) return '🔊';
    if (/battery|power/.test(n)) return '🔋';
    if (/security|shield|defender|virus/.test(n)) return '🛡️';
    if (/bluetooth/.test(n)) return '🔵';
    if (/notification/.test(n)) return '🔔';
    return '▫';
  }

  function renderTray(tray) {
    const list = tray || [];
    const sig = list.map(t => t.name).join('|');
    if (sig === state.traySig) return;
    state.traySig = sig;
    trayEl.innerHTML = '';
    list.forEach(t => {
      const s = document.createElement('span');
      s.className = 'real-tray-glyph';
      s.title = t.name + (t.processName ? ' — ' + t.processName : '');
      if (t.icon) {
        const img = document.createElement('img');
        img.src = t.icon; img.alt = '';
        s.appendChild(img);
      } else {
        s.textContent = trayGlyph(t.name);
      }
      trayEl.appendChild(s);
    });
    const vol = document.getElementById('trayVol');
    if (vol) vol.style.display = list.length ? 'none' : '';
  }

  async function refresh() {
    if (state.busy || document.hidden) return;
    state.busy = true;
    try {
      const data = await DTM.system.getTaskbar();
      renderPinned(data.pinned);
      renderWindows(data.windows);
      renderTray(data.tray);
    } catch (e) {
      // Taskbar mirroring is best-effort and host-dependent.
    } finally {
      state.busy = false;
    }
  }

  refresh();
  const interval = setInterval(refresh, 10000);
  window.addEventListener('focus', refresh);
  window.addEventListener('unload', () => clearInterval(interval));
}
setupRealTaskbar();
})();

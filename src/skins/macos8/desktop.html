<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' file:; frame-src 'self' file:; script-src 'self' 'unsafe-inline' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: file:; font-src 'self' data: file:;">
<title>Mac OS 8 — Classic Desktop</title>
<link rel="stylesheet" href="../shared/cursors-mac.css">
<style>
:root {
  --sys-font: "Geneva", "Charcoal", "Lucida Grande", "Helvetica Neue", sans-serif;
  --platinum: #dddddd;
  --platinum-dark: #888888;
  --platinum-light: #f4f4f4;
  --black: #000000;
  --blue: #0000aa;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; width: 100%; height: 100%; overflow: hidden;
  font-family: var(--sys-font); font-size: 12px; color: var(--black);
  user-select: none;
}

/* AUTHENTIC 50% GREY DITHER PATTERN */
body {
  background-color: #888;
  background-image: 
    linear-gradient(45deg, #777 25%, transparent 25%, transparent 75%, #777 75%, #777),
    linear-gradient(45deg, #777 25%, #888 25%, #888 75%, #777 75%, #777);
  background-size: 4px 4px;
  background-position: 0 0, 2px 2px;
}

/* STARTUP SCREEN */
#boot-screen {
  position: fixed; inset: 0; background: #888; z-index: 999999;
  display: flex; justify-content: center; align-items: center; flex-direction: column;
  transition: opacity 0.8s;
}
.happy-mac { font-size: 80px; filter: drop-shadow(2px 2px 0 #000); }

/* MENU BAR */
.menubar {
  position: absolute; top: 0; left: 0; right: 0; height: 22px;
  background: #ffffff; border-bottom: 1px solid #000;
  display: flex; align-items: center; padding: 0 10px; z-index: 10000;
  font-weight: bold; font-size: 13px;
}
.menu-item { padding: 2px 8px; cursor: default; position: relative; }
.menu-item:hover { background: var(--blue); color: #fff; }
.apple-logo { font-size: 16px; padding: 0 12px 0 6px; }
.menu-clock { margin-left: auto; padding-right: 15px; font-weight: normal; }

/* MENU DROPDOWNS */
.menu-dropdown {
  display: none; position: absolute; top: 22px; left: 0;
  background: #ffffff; border: 1px solid #000; border-top: none;
  width: 220px; padding: 0; box-shadow: 2px 2px 0 rgba(0,0,0,0.3); z-index: 10001;
}
.menu-dropdown.open { display: block; }
.menu-dropdown .am-item { padding: 4px 20px; cursor: default; font-size: 12px; display: flex; justify-content: space-between; }
.menu-dropdown .am-item:hover { background: var(--blue); color: #fff; }
.am-sep { height: 1px; background: #aaa; margin: 4px 0; }

/* DESKTOP */
.desktop { position: absolute; inset: 22px 0 0 0; padding: 20px; overflow: hidden; }
.desktop-icons { position: relative; width: 100%; height: 100%; pointer-events: none; }
.desktop-icon { 
  position: absolute; display: flex; flex-direction: column; align-items: center; 
  width: 75px; cursor: default; pointer-events: auto; 
}
.icon-img { font-size: 42px; line-height: 45px; padding: 2px; border: 1px solid transparent; filter: drop-shadow(1px 1px 0 #fff); pointer-events: none; }
.icon-label { color: #000; font-size: 12px; text-align: center; margin-top: 2px; padding: 1px 4px; border-radius: 2px; pointer-events: none; }
.desktop-icon.selected .icon-img { background: var(--blue); border: 1px dotted #fff; filter: none; }
.desktop-icon.selected .icon-label { background: var(--blue); color: #fff; }

/* TRASH */
.trash-bin {
  position: absolute; bottom: 35px; right: 20px; display: flex; flex-direction: column; align-items: center; cursor: default;
}
.trash-bin .icon-img { font-size: 50px; }
.trash-bin.selected .icon-img { background: var(--blue); border: 1px dotted #fff; }
.trash-bin.selected .icon-label { background: var(--blue); color: #fff; }

/* CONTROL STRIP */
.control-strip {
  position: absolute; bottom: 0; left: 0; height: 28px;
  background: var(--platinum); border-top: 1px solid #fff; border-right: 1px solid #000;
  display: flex; align-items: center; padding: 0 5px; gap: 2px; z-index: 9999;
  border-top-right-radius: 8px; box-shadow: 1px -1px 0 #000;
}
.cs-apple { font-size: 16px; padding: 0 6px; cursor: pointer; }
.cs-apple:hover { background: #000; color: #fff; }
.cs-drag { width: 10px; height: 20px; background: repeating-linear-gradient(to right, #888 0, #888 1px, transparent 1px, transparent 3px); cursor: ew-resize; margin: 0 5px; }
.cs-icon { width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; font-size: 16px; cursor: pointer; border: 1px solid transparent; border-radius: 3px; }
.cs-icon:hover { border-color: #888 #fff #fff #888; background: #e0e0e0; }
.cs-icon:active { border-color: #fff #888 #888 #fff; background: #ccc; }
.cs-running { display: flex; align-items: center; gap: 3px; padding: 0 5px; border-left: 1px solid #aaa; margin-right: 3px; min-height: 22px; }
.cs-running-item { width: 18px; height: 18px; display: grid; place-items: center; font-size: 11px; border: 1px solid #888; border-radius: 2px; background: #ddd; cursor: pointer; }
.cs-running-item.active { background: var(--blue); color: #fff; }

/* WINDOWS */
.window {
  position: absolute; background: var(--platinum); min-width: 200px; min-height: 100px;
  border: 1px solid #000; box-shadow: 2px 2px 0 #000;
  display: flex; flex-direction: column; z-index: 10; transition: height 0.1s;
}
.window.active { box-shadow: 3px 3px 0 #000; }
.window.shaded { height: 20px !important; min-height: 20px; }
.window.shaded .window-body, .window.shaded .resize-box { display: none; }
.window.shaded .title-bar { border-bottom: none; }

.title-bar {
  height: 20px; display: flex; align-items: center; padding: 0 4px; border-bottom: 1px solid #000;
  background: #fff; position: relative; cursor: move;
}
.window.active .title-bar {
  background: repeating-linear-gradient(to bottom, #ddd, #ddd 1px, #a0a0a0 1px, #a0a0a0 2px);
}
.window.inactive .title-bar { background: #ccc; }
.title-bar .title-text {
  flex: 1; text-align: center; font-size: 12px; font-weight: bold; color: #000;
  background: #fff; padding: 1px 10px; border: 1px solid #000; border-radius: 4px; margin: 0 10px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  position: relative; z-index: 2;
}
.window.inactive .title-bar .title-text { color: #999; background: #eee; }

.close-box {
  width: 12px; height: 12px; border: 1px solid #000; background: #fff; cursor: pointer;
  position: absolute; left: 6px; display: flex; justify-content: center; align-items: center; z-index: 3;
}
.window.active .close-box::after { content: ''; display: block; width: 4px; height: 4px; background: #000; }
.zoom-box {
  width: 12px; height: 12px; border: 1px solid #000; background: #fff; cursor: pointer;
  position: absolute; right: 6px; z-index: 3;
}
.zoom-box::after { content: ''; display: block; width: 6px; height: 6px; border: 1px solid #000; margin: 2px; }

.resize-box {
  position: absolute; bottom: 0; right: 0; width: 15px; height: 15px;
  cursor: nwse-resize; z-index: 10;
}
.resize-box::after { content: ''; display: block; width: 100%; height: 100%; background: repeating-linear-gradient(135deg, transparent, transparent 2px, #000 2px, #000 3px); }

.window-body { flex: 1; background: #fff; overflow: auto; border: 1px solid #000; margin: 2px; position: relative; }
.window.inactive .window-body { background: #eee; }

/* CLASSIC SCROLLBARS */
::-webkit-scrollbar { width: 16px; height: 16px; background: #ddd; }
::-webkit-scrollbar-thumb { background: #fff; border: 1px solid #000; }
::-webkit-scrollbar-button:single-button { background-color: #ddd; border: 1px solid #000; display: block; height: 16px; width: 16px; }
::-webkit-scrollbar-button:single-button:vertical:decrement { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><polygon points="5,2 9,8 1,8" fill="black"/></svg>'); background-repeat: no-repeat; background-position: center; }
::-webkit-scrollbar-button:single-button:vertical:increment { background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><polygon points="5,8 9,2 1,2" fill="black"/></svg>'); background-repeat: no-repeat; background-position: center; }

/* CONTEXT MENU */
.context-menu {
  position: absolute; background: #fff; border: 1px solid #000; box-shadow: 2px 2px 0 rgba(0,0,0,0.3);
  padding: 2px; z-index: 20000; min-width: 150px;
}
.context-menu div { padding: 4px 20px; cursor: default; font-size: 12px; }
.context-menu div:hover { background: var(--blue); color: #fff; }

/* FINDER LIST */
.finder-header { border-bottom: 1px solid #000; padding: 4px 8px; font-size: 11px; background: #eee; display: flex; justify-content: space-between; }
.finder-list { padding: 15px; display: flex; flex-wrap: wrap; gap: 20px; }
.finder-item { display: flex; flex-direction: column; align-items: center; width: 75px; cursor: default; }
.finder-item .icon-img { font-size: 32px; }
.finder-item .icon-label { font-size: 11px; }

/* CALCULATOR */
.mac-calc { padding: 10px; background: var(--platinum); height: 100%; display: flex; flex-direction: column; }
.calc-display { background: #fff; border: 1px solid #000; text-align: right; padding: 4px 8px; font-family: "Courier", monospace; font-size: 20px; margin-bottom: 10px; height: 35px; }
.calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: 1; }
.calc-btn { background: var(--platinum); border: 2px solid; border-color: #fff #555 #555 #fff; border-radius: 4px; font-size: 14px; font-weight: bold; cursor: pointer; outline: none; }
.calc-btn:active { border-color: #555 #fff #fff #555; }
.calc-btn.op { background: #bbb; }

/* SIMPLETEXT */
.simpletext-area { width: 100%; height: calc(100% - 30px); border: none; resize: none; outline: none; font-family: "Courier", monospace; font-size: 13px; padding: 10px; user-select: text; display: block; }
.st-bar { display: flex; align-items: center; gap: 6px; height: 30px; padding: 3px 6px; background: #ddd; border-bottom: 1px solid #888; }
.st-bar button { font: 11px Geneva, sans-serif; padding: 2px 8px; background: #ddd; border: 2px solid; border-color: #fff #444 #444 #fff; cursor: pointer; }
.st-status { margin-left: auto; font: 11px Geneva, sans-serif; color: #444; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* STICKIES */
.stickies-container { padding: 10px; background: #fff; height: 100%; overflow: auto; display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; }
.sticky-note { width: 150px; height: 150px; background: #ffffaa; border: 1px solid #ccaa00; box-shadow: 2px 2px 4px rgba(0,0,0,0.2); padding: 5px; display: flex; flex-direction: column; }
.sticky-note textarea { flex: 1; background: transparent; border: none; resize: none; outline: none; font-family: "Marker Felt", "Comic Sans MS", cursive; font-size: 12px; user-select: text; }

/* ABOUT */
.about-mac { padding: 20px; text-align: center; background: #fff; height: 100%; font-size: 12px; }
.rainbow-apple { font-size: 60px; margin-bottom: 10px; }
</style>

<body>

</div>

<div class="menubar" id="menubar">
  <div class="menu-item apple-logo" id="appleBtn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" style="display:block;"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" fill="#000"/></svg></div>

  <div class="cs-apple" onclick="toggleAppleMenu(event)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" style="display:block;"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" fill="#000"/></svg></div>

  <div class="cs-icon" onclick="openApp('sharedapps')" title="Applications">🧰</div>
  <div class="cs-icon" onclick="if(window.parent)window.parent.postMessage('dtm:open-switcher','*');" title="Desktop Time Machine">⏳</div>
  <div class="cs-icon" onclick="cycleVolume()" title="Volume (click to mute/unmute)">🔊</div>
  <div class="cs-icon" onclick="alert('This computer has no battery.')" title="Power">🔋</div>
</div>

<script>
// Connect to DTM Shared Engine
const DTM = (window.parent && window.parent.DTM) ? window.parent.DTM : (window.DTM || null);

let z = 100;
let winCount = 0;
let activeWindow = null;
let activeApp = 'finder';
let trashItems = [];

// HOTKEY FORWARDING
window.addEventListener('keydown', (e) => {
  if (e.key === 'F8' || (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 't')) {
    e.preventDefault();
    if (window.parent) window.parent.postMessage('dtm:open-switcher', '*');
  } else if (e.ctrlKey && e.key === 'F5') {
    // Ctrl+F5 toggles fullscreen for the whole app.
    e.preventDefault();
    if (DTM && DTM.system.toggleFullScreen) DTM.system.toggleFullScreen();
  } else if (e.key === 'Delete' || e.key === 'Backspace') {
    if (recycleSelected()) e.preventDefault();
  }
});

// Shared window state drives the running-application strip in the Control Strip.
window.addEventListener('message', (event) => {
  const data = event.data;
  if (data && data.type === 'dtm:windows-state') renderRunningApps(data.windows || []);
});
function renderRunningApps(states) {
  const strip = document.getElementById('csRunning');
  if (!strip) return;
  strip.replaceChildren();
  states.forEach((state) => {
    const item = document.createElement('div');
    item.className = 'cs-running-item' + (state.active ? ' active' : '');
    item.textContent = state.icon || '🪟';
    item.title = state.title + (state.minimized ? ' (minimized)' : '');
    item.addEventListener('click', () => {
      if (window.parent) window.parent.postMessage({ type: 'dtm:window-action', id: state.id, app: state.app, action: state.minimized || !state.active ? 'activate' : 'minimize' }, '*');
    });
    strip.appendChild(item);
  });
}

async function cycleVolume() {
  if (!DTM || !DTM.system) return;
  try {
    const current = await DTM.system.getVolume();
    await DTM.system.setVolume(current.level == null ? 1 : current.level, !(current.muted));
  } catch (e) { /* volume control is host-dependent */ }
}

// AUDIO: MAC STARTUP CHIME
let audioCtx = null;
function playChime() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    if (audioCtx) {
      try { audioCtx.close(); } catch(e) {}
    }
    audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    const freqs = [185.00, 233.08, 293.66, 369.99, 466.16]; // F# Major chord
    freqs.forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 2.5);
    });
  } catch(e) { console.log('Audio not supported', e); }
}

window.addEventListener('unload', () => {
  if (audioCtx) {
    try { audioCtx.close(); } catch(e) {}
    audioCtx = null;
  }
});

// BOOT SEQUENCE
setTimeout(() => {
  playChime();
  document.getElementById('boot-screen').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('boot-screen').style.display = 'none';
    openApp('about');
  }, 800);
}, 500);

// CLOCK
setInterval(() => {
  const d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
}, 1000);

// MENU LOGIC
document.querySelectorAll('.menu-item').forEach(item => {
  item.addEventListener('click', (e) => {
    e.stopPropagation();
    const menuId = item.dataset.menu ? item.dataset.menu + 'Menu' : 'appleMenu';
    const target = document.getElementById(menuId);
    document.querySelectorAll('.menu-dropdown').forEach(m => m.classList.remove('open'));
    if (target) target.classList.toggle('open');
  });
});

function toggleAppleMenu(e) {
  e.stopPropagation();
  document.querySelectorAll('.menu-dropdown').forEach(m => m.classList.remove('open'));
  document.getElementById('appleMenu').classList.toggle('open');
}

document.addEventListener('click', () => {
  document.querySelectorAll('.menu-dropdown').forEach(m => m.classList.remove('open'));
  document.querySelectorAll('.context-menu').forEach(m => m.remove());
});

function updateMenus(appName) {
  activeApp = appName;
  const fileMenu = document.getElementById('fileMenu');
  
  if (appName === 'finder') {
    fileMenu.innerHTML = `
      <div class="am-item" onclick="openApp('finder')">New Finder Window <span>⌘N</span></div>
      <div class="am-item" onclick="openApp('simpletext')">New Document</div>
      <div class="am-sep"></div>
      <div class="am-item" onclick="closeActiveWindow()">Close Window <span>⌘W</span></div>
    `;
  } else if (appName === 'simpletext') {
    fileMenu.innerHTML = `
      <div class="am-item" onclick="document.querySelector('.window.active[data-app=\'simpletext\'] .st-save')?.click()">Save <span>⌘S</span></div>
      <div class="am-sep"></div>
      <div class="am-item" onclick="closeActiveWindow()">Close <span>⌘W</span></div>
    `;
  } else {
    fileMenu.innerHTML = `
      <div class="am-item" onclick="closeActiveWindow()">Close Window <span>⌘W</span></div>
    `;
  }
}

// SHUTDOWN
function shutDown() {
  document.body.innerHTML = `
    <div style="background:#000;color:#fff;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Geneva,sans-serif;text-align:center;gap:18px;">
      <div style="font-size:22px;font-weight:bold;">It is now safe to turn off your Macintosh.</div>
      <p style="color:#aaa;max-width:450px;">Desktop Time Machine has prepared the environment for shutdown.</p>
      <div style="display:flex;gap:12px;">
        <button onclick="if(DTM)DTM.system.exit();else alert('Exited');" style="background:#ddd;border:2px solid;border-color:#fff #444 #444 #fff;padding:8px 18px;font-size:13px;font-weight:bold;cursor:pointer;">Exit to Windows</button>
        <button onclick="location.reload()" style="background:#ddd;border:2px solid;border-color:#fff #444 #444 #fff;padding:8px 18px;font-size:13px;cursor:pointer;">Restart Macintosh</button>

const desktopIconsData = [
  { id: 'hd', app: 'finder', icon: '🖥️', label: 'Macintosh HD', right: 20, y: 20 },
  { id: 'timemachine', app: 'timemachine', icon: '⏳', label: 'Time Machine', right: 20, y: 100 },

function renderDesktopIcons() {
  const container = document.getElementById('desktop-icons');
  container.innerHTML = '';
  desktopIconsData.forEach(data => {
    const el = document.createElement('div');
    el.className = 'desktop-icon';
    el.dataset.app = data.app;
    el.dataset.id = data.id;
    // Mac OS: icons on the right side
    if (data.right !== undefined) {
      el.style.right = data.right + 'px';
    } else {
      el.style.left = data.x + 'px';
    }
    el.style.top = data.y + 'px';
    el.innerHTML = `
      <div class="icon-img">${data.icon}</div>
      <div class="icon-label">${data.label}</div>
    `;
    
    // Selection
    el.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      e.stopPropagation();
      document.querySelectorAll('.desktop-icon, .trash-bin').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
      
      // Drag logic
      let startX = e.clientX, startY = e.clientY;
      let origX = parseInt(el.style.left), origY = parseInt(el.style.top);
      let dragging = false;
      
      const onMouseMove = (ev) => {
        if (Math.abs(ev.clientX - startX) > 3 || Math.abs(ev.clientY - startY) > 3) dragging = true;
        if (!dragging) return;
        el.style.left = origX + (ev.clientX - startX) + 'px';
        el.style.top = origY + (ev.clientY - startY) + 'px';
      };
      
      const onMouseUp = (ev) => {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
        
        // Check if dropped on trash
        const trashRect = document.getElementById('trashBin').getBoundingClientRect();
        if (ev.clientX >= trashRect.left && ev.clientX <= trashRect.right &&
            ev.clientY >= trashRect.top && ev.clientY <= trashRect.bottom) {
          trashItems.push(data.label);
          desktopIconsData.splice(desktopIconsData.findIndex(d => d.id === data.id), 1);
          renderDesktopIcons();
          document.getElementById('trashIcon').textContent = '🗑️🗑️';
        } else {
          data.x = parseInt(el.style.left);
          data.y = parseInt(el.style.top);
        }
      };
      
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    });

    el.addEventListener('dblclick', () => {
      if (data.app === 'timemachine') {
        if (window.parent) window.parent.postMessage('dtm:open-switcher', '*');
      } else {
        openApp(data.app);
      }
    });

    // Context menu on icon
    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
      document.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
      el.classList.add('selected');
      showContextMenu(e.clientX, e.clientY, [
        { label: 'Open', action: () => (data.app === 'timemachine' ? (window.parent && window.parent.postMessage('dtm:open-switcher', '*')) : openApp(data.app)) },
        { label: 'Get Info', action: () => alert('Info: ' + data.label) },
        { label: 'Move to Trash', action: () => {
            trashItems.push(data.label);
            desktopIconsData.splice(desktopIconsData.findIndex(d => d.id === data.id), 1);
            renderDesktopIcons();
            document.getElementById('trashIcon').textContent = '🗑️🗑️';
          } 
        }
      ]);
    });
    
    container.appendChild(el);
  });
}
renderDesktopIcons();

// In-skin modal prompt — Electron renderers do not support window.prompt().
function hostPrompt(title, message, defaultValue) {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'dtm-modal-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:100200;display:flex;align-items:center;justify-content:center;';
    const dlg = document.createElement('div');
    dlg.style.cssText = 'width:340px;background:#d8d8d8;border:1px solid #666;box-shadow:3px 3px 8px rgba(0,0,0,.4);font-family:Geneva,Chicago,Tahoma,sans-serif;font-size:12px;';
    const bar = document.createElement('div');
    bar.style.cssText = 'padding:5px 10px;font-weight:bold;color:#000;background:linear-gradient(#f0f0f0,#c8c8c8);border-bottom:1px solid #999;';
    bar.textContent = title;
    const body = document.createElement('div');
    body.style.cssText = 'padding:12px;';
    const label = document.createElement('div');
    label.style.cssText = 'margin-bottom:6px;';
    label.textContent = message;
    const input = document.createElement('input');
    input.className = 'hostprompt-input';
    input.style.cssText = 'width:100%;box-sizing:border-box;padding:3px 6px;font-family:Geneva,Tahoma;font-size:12px;border:1px solid #777;background:#fff;';
    input.value = defaultValue || '';
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;justify-content:flex-end;gap:8px;margin-top:12px;';
    const mkBtn = (text, cls) => {
      const b = document.createElement('button');
      b.textContent = text;
      b.className = cls;
      b.style.cssText = 'min-width:70px;padding:3px 12px;border:1px solid #777;background:#e8e8e8;font-family:Geneva,Tahoma;font-size:12px;';
      return b;
    };
    const ok = mkBtn('OK', 'hostprompt-ok');
    const cancel = mkBtn('Cancel', 'hostprompt-cancel');
    row.append(ok, cancel);
    body.append(label, input, row);
    dlg.append(bar, body);
    overlay.appendChild(dlg);
    document.body.appendChild(overlay);
    const done = (val) => { overlay.remove(); resolve(val); };
    ok.addEventListener('click', () => done(input.value.trim()));
    cancel.addEventListener('click', () => done(null));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') done(input.value.trim());
      if (e.key === 'Escape') done(null);
    });
    overlay.addEventListener('pointerdown', (e) => { if (e.target === overlay) done(null); });
    setTimeout(() => { input.focus(); input.select(); }, 30);
  });
}

// REAL HOST FILESYSTEM FINDER (shared engine.fs backend, Platinum interface)
function setupFinder(w) {
  let currentPath = '';
  const list = w.querySelector('#finder-list');
  const header = w.querySelector('#finder-header');

  async function loadPath(target) {
    if (!DTM || !DTM.fs) {
      header.innerHTML = '<span>Filesystem unavailable</span>';
      return;
    }
    list.innerHTML = '<div style="padding:15px;">Reading folder…</div>';
    try {
      const result = await DTM.fs.list(target);
      currentPath = result.path;

      header.innerHTML = '';
      const up = document.createElement('button');
      up.textContent = '↑ Up';
      up.style.cssText = 'background:#ddd;border:2px solid;border-color:#fff #444 #444 #fff;padding:2px 10px;cursor:pointer;';
      if (result.parentPath) up.onclick = () => loadPath(result.parentPath);
      else up.disabled = true;
      header.appendChild(up);

      const pathLabel = document.createElement('span');
      pathLabel.textContent = '  ' + currentPath;
      header.appendChild(pathLabel);

      const newBtn = document.createElement('button');
      newBtn.textContent = 'New Folder';
      newBtn.style.cssText = 'background:#ddd;border:2px solid;border-color:#fff #444 #444 #fff;padding:2px 10px;cursor:pointer;margin-left:8px;';
      newBtn.onclick = async () => {
        const name = await hostPrompt('New Folder', 'Name for the new folder:', 'New Folder');
        if (!name) return;
        try {
          await DTM.fs.mkdir(`${currentPath}\\${name}`);
          loadPath(currentPath);
        } catch (err) {
          alert('Could not create folder: ' + err.message);
        }
      };
      header.appendChild(newBtn);

      list.innerHTML = '';
      result.items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'finder-item';
        el.innerHTML = `<div class="icon-img">${item.isDirectory ? '📁' : '📄'}</div><div class="icon-label"></div>`;
        el.querySelector('.icon-label').textContent = item.name;
        el.dataset.path = item.path;
        el.title = item.path;
        el.addEventListener('click', () => {
          list.querySelectorAll('.finder-item').forEach((node) => node.classList.remove('selected'));
          el.classList.add('selected');
        });
        el.addEventListener('dblclick', () => {
          if (item.isDirectory) {
            loadPath(item.path);
          } else {
            DTM.system.openPath(item.path).catch(err => alert('Could not open file: ' + err.message));
          }
        });
        list.appendChild(el);
      });

      if (result.items.length === 0) {
        list.innerHTML = '<div style="padding:15px;color:#888;">Folder is empty.</div>';
      }
    } catch (err) {
      list.innerHTML = `<div style="padding:15px;color:red;">${err.message}</div>`;
      header.innerHTML = '<span>Error</span>';
    }
  }
  window.reloadFinder = () => loadPath(currentPath);
  loadPath('');
}

// WINDOW MANAGEMENT
function openApp(key) {
  document.querySelectorAll('.menu-dropdown').forEach(m => m.classList.remove('open'));
  document.querySelectorAll('.context-menu').forEach(m => m.remove());
  
  if (key === 'sharedapps') { if (window.DTMApps) window.DTMApps.open('launcher'); return; }
  // Handle browser apps that launch in the shell
  if (key === 'netscape') {
    if (window.parent) window.parent.postMessage({ type: 'dtm:launch-webapp', app: 'browser', url: 'https://home.netscape.com/' }, '*');
    return;
  }
  
  const app = apps[key]; if (!app) return;

  const existing = document.querySelector(`.window[data-app="${key}"]`);
  if (existing) { focusWin(existing); return; }

  const w = document.createElement('section');
  w.className = 'window active';
  w.dataset.app = key;
  w.style.width = app.width + 'px';
  w.style.height = app.height + 'px';
  w.style.left = Math.max(10, Math.min(innerWidth - app.width - 20, 100 + winCount * 20)) + 'px';
  w.style.top = Math.max(10, Math.min(innerHeight - app.height - 20, 80 + winCount * 20)) + 'px';
  winCount++;

  w.innerHTML = `
    <div class="title-bar">
      <div class="close-box" data-close></div>
      <div class="title-text">${app.title}</div>
      <div class="zoom-box" data-zoom></div>
    </div>
    <div class="window-body">${app.body()}</div>
    <div class="resize-box"></div>
  `;

  document.getElementById('desktop').appendChild(w);
  focusWin(w);
  makeDraggable(w);
  if (key === 'trash') renderTrashWindow(w);

  w.querySelector('[data-close]').addEventListener('click', (e) => { e.stopPropagation(); w.remove(); });
  w.querySelector('[data-zoom]').addEventListener('click', (e) => {
    e.stopPropagation();
    if (w.style.width === '100vw') {
      w.style.width = app.width + 'px'; w.style.height = app.height + 'px';
      w.style.left = '100px'; w.style.top = '80px';
    } else {
      w.style.width = '100vw'; w.style.height = 'calc(100vh - 22px)';
      w.style.left = '0px'; w.style.top = '0px';
    }
  });

  w.addEventListener('mousedown', () => focusWin(w));

  if (key === 'calculator') {
    let current = '0', previous = '', operation = null, resetNext = false;
    const screen = w.querySelector('#calc-screen');
    window.calcInput = (val) => {
      if (val === 'C') { current = '0'; previous = ''; operation = null; resetNext = false; }
      else if (val === '±') { current = String(parseFloat(current) * -1); }
      else if (val === '%') { current = String(parseFloat(current) / 100); }
      else if (['+', '-', '*', '/'].includes(val)) {
        if (operation && !resetNext) { calculate(); }
        previous = current; operation = val; resetNext = true;
      } else if (val === '=') {
        if (operation) { calculate(); operation = null; }
      } else if (val === '.') {
        if (resetNext) { current = '0.'; resetNext = false; }
        else if (!current.includes('.')) current += '.';
      } else {
        if (resetNext) { current = val; resetNext = false; }
        else current = current === '0' ? val : current + val;
      }
      screen.textContent = current.length > 12 ? parseFloat(current).toExponential(5) : current;
    };
    function calculate() {
      const a = parseFloat(previous), b = parseFloat(current);
      let res = 0;
      if (operation === '+') res = a + b;
      if (operation === '-') res = a - b;
      if (operation === '*') res = a * b;
      if (operation === '/') res = b === 0 ? 'Error' : a / b;
      current = String(res);
      resetNext = true;
    }
  }

  if (key === 'finder') setupFinder(w);
  if (key === 'simpletext') setupSimpleText(w);
}

function setupSimpleText(w) {
  const area = w.querySelector('#stArea');
  const status = w.querySelector('.st-status');
  let path = null;
  const write = async () => {
    if (!DTM || !DTM.fs) { status.textContent = 'Filesystem unavailable'; return; }
    if (!path) path = await hostPrompt('Save SimpleText Document', 'Save to a full file path:', 'Untitled.txt');
    if (!path) return;
    try {
      await DTM.fs.write(path, area.value);
      status.textContent = path;
    } catch (e) { status.textContent = 'Save failed: ' + e.message; }
  };
  w.querySelector('.st-save').addEventListener('click', write);
  w.querySelector('.st-open').addEventListener('click', async () => {
    if (!DTM || !DTM.fs) { status.textContent = 'Filesystem unavailable'; return; }
    const target = await hostPrompt('Open SimpleText Document', 'Enter a full file path:');
    if (!target) return;
    try {
      area.value = await DTM.fs.read(target);
      path = target;
      status.textContent = target;
    } catch (e) { status.textContent = 'Open failed: ' + e.message; }
  });
  area.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); write(); }
  });
}

function focusWin(w) {
  if (activeWindow && activeWindow !== w) {
    activeWindow.classList.remove('active');
    activeWindow.classList.add('inactive');
  }
  activeWindow = w;
  w.style.zIndex = ++z;
  w.classList.remove('inactive');
  w.classList.add('active');
  
  updateMenus(w.dataset.app);
  
  const runningApps = document.getElementById('apple-running-apps');
  runningApps.innerHTML = '';
  document.querySelectorAll('.window').forEach(win => {
    const appDef = apps[win.dataset.app];
    if (appDef) {
      const item = document.createElement('div');
      item.className = 'am-item';
      item.textContent = appDef.title;
      item.onclick = () => focusWin(win);
      runningApps.appendChild(item);
    }
  });
}

function closeActiveWindow() {
  if (activeWindow) { activeWindow.remove(); activeWindow = null; }
  updateMenus('finder');
}

function makeDraggable(w) {
  const bar = w.querySelector('.title-bar');
  const resizer = w.querySelector('.resize-box');
  let ox = 0, oy = 0, moving = false, resizing = false, startW = 0, startH = 0, startX = 0, startY = 0;

  bar.addEventListener('mousedown', (e) => {
    if (e.target.closest('.close-box') || e.target.closest('.zoom-box')) return;
    moving = true;
    ox = e.clientX - w.offsetLeft;
    oy = e.clientY - w.offsetTop;
  });

  bar.addEventListener('dblclick', (e) => {
    if (e.target.closest('.close-box') || e.target.closest('.zoom-box')) return;
    w.classList.toggle('shaded');
  });

  resizer.addEventListener('mousedown', (e) => {
    e.stopPropagation();
    resizing = true;
    startW = w.offsetWidth; startH = w.offsetHeight;
    startX = e.clientX; startY = e.clientY;
  });

  document.addEventListener('mousemove', (e) => {
    if (moving) {
      w.style.left = Math.max(0, Math.min(innerWidth - w.offsetWidth, e.clientX - ox)) + 'px';
      w.style.top = Math.max(22, Math.min(innerHeight - 22, e.clientY - oy)) + 'px';
    }
    if (resizing) {
      w.style.width = Math.max(200, startW + (e.clientX - startX)) + 'px';
      w.style.height = Math.max(100, startH + (e.clientY - startY)) + 'px';
    }
  });

  document.addEventListener('mouseup', () => { moving = false; resizing = false; });
}

document.querySelectorAll('.am-item[data-app]').forEach(item => {
  item.addEventListener('click', () => openApp(item.dataset.app));
});

async function renderTrashWindow(w) {
  const body = w.querySelector('.window-body');
  body.innerHTML = '<div style="padding:20px;color:#888;">Reading Trash…</div>';
  let items = [];
  try { items = DTM && DTM.fs && DTM.fs.recycleList ? await DTM.fs.recycleList() : []; } catch (e) {}
  const real = items.filter(item => item && item.name);
  body.replaceChildren();
  const title = document.createElement('div');
  title.style.cssText = 'padding:8px 12px;font-weight:bold;border-bottom:1px solid #888;';
  title.textContent = real.length ? real.length + ' item(s) in Trash' : 'The Trash is empty.';
  body.appendChild(title);
  if (real.length) {
    const list = document.createElement('div');
    list.className = 'finder-list';
    real.forEach((item) => {
      const row = document.createElement('div');
      row.className = 'finder-item';
      row.innerHTML = '<div class="icon-img">🗑️</div><div class="icon-label"></div>';
      row.querySelector('.icon-label').textContent = item.name;
      row.title = item.path || '';
      list.appendChild(row);
    });
    body.appendChild(list);
    const empty = document.createElement('button');
    empty.className = 'aqua-btn gray';
    empty.textContent = 'Empty Trash';
    empty.style.cssText = 'margin:10px 12px;padding:3px 12px;background:#ddd;border:2px solid;border-color:#fff #444 #444 #fff;cursor:pointer;';
    empty.addEventListener('click', emptyTrash);
    body.appendChild(empty);
  }
}

async function emptyTrash() {
  try { if (DTM && DTM.fs && DTM.fs.recycleEmpty) await DTM.fs.recycleEmpty(); } catch (e) { alert('Could not empty Trash: ' + e.message); }
  trashItems = [];
  document.getElementById('trashIcon').textContent = '🗑️';
  const trashWin = document.querySelector('.window[data-app="trash"]');
  if (trashWin) renderTrashWindow(trashWin);
  document.querySelectorAll('.menu-dropdown').forEach(m => m.classList.remove('open'));
}

// Move the current desktop/Finder selection to the real Windows Recycle Bin.
function recycleSelected() {
  const paths = [];
  document.querySelectorAll('.dtm-icon.selected[data-path]').forEach((el) => paths.push(el.dataset.path));
  document.querySelectorAll('.window[data-app="finder"] .finder-item.selected[data-path]').forEach((el) => paths.push(el.dataset.path));
  if (!paths.length) return false;
  (async () => {
    let moved = 0;
    for (const target of paths) {
      try { await DTM.fs.recycle(target); moved++; } catch (e) { alert('Could not move to Trash: ' + e.message); }
    }
    if (moved) {
      if (DTM.desktop && DTM.desktop.invalidate) DTM.desktop.invalidate();
      if (window.dtmMirrorHandle && window.dtmMirrorHandle.refresh) window.dtmMirrorHandle.refresh();
      document.getElementById('trashIcon').textContent = '🗑️🗑️';
      const trashWin = document.querySelector('.window[data-app="trash"]');
      if (trashWin) renderTrashWindow(trashWin);
      const finder = document.querySelector('.window[data-app="finder"]');
      if (finder && typeof window.reloadFinder === 'function') window.reloadFinder();
    }
  })();
  return true;
}

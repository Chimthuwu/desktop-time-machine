<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' file:; frame-src 'self' file: https:; script-src 'self' 'unsafe-inline' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: file: https:; font-src 'self' data: file:;">
  <title>Desktop Time Machine</title>
  <link rel="stylesheet" href="./components/SkinSwitcher/switcher.css">
  <link rel="stylesheet" href="./components/ShellApps/shell-apps.css">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      user-select: none;
    }
    #skin-viewport {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #008080;
    }
  </style>
</head>
<body>

  <!-- Active Retro Skin Viewport (mounted by the skin manager after init) -->
  <iframe id="skin-viewport" class="skin-viewport" src="about:blank" title="Active retro desktop"></iframe>

  <!-- Browser / Discord windows live in the shell (webview is top-frame only) -->
  <div id="shell-app-layer"></div>

  <!-- Core Engine and Management Scripts -->
  <script src="./core/desktop-engine/engine.js"></script>
  <script src="./core/desktop-mirror/context-menu-profiles.js"></script>
  <script src="./core/desktop-mirror/desktop-mirror.js"></script>
  <script src="./core/skin-manager/skin-manager.js"></script>
  <script src="./components/SkinSwitcher/switcher.js"></script>
  <script src="./components/ShellApps/shell-apps.js"></script>
  <script src="./components/WindowTracking/window-registry.js"></script>

  <script>
    function showStartupFailure(message) {
      let overlay = document.getElementById('dtmStartupFailure');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'dtmStartupFailure';
        overlay.setAttribute('role', 'alert');
        overlay.style.cssText = 'position:fixed;inset:0;z-index:20000;display:grid;place-items:center;background:#1b1b1b;color:#eee;font:14px Tahoma,Arial,sans-serif;text-align:center';
        overlay.innerHTML = '<div><h2>Desktop Time Machine could not start</h2><p id="dtmStartupFailureDetail" aria-live="assertive"></p><button id="dtmStartupRetry">Retry</button></div>';
        document.body.appendChild(overlay);
        overlay.querySelector('#dtmStartupRetry').addEventListener('click', async () => {
          overlay.querySelector('#dtmStartupRetry').disabled = true;
          const ok = await window.dtmSkinManager.mountActiveSkin();
          if (ok) overlay.remove();
          else overlay.querySelector('#dtmStartupRetry').disabled = false;
        });
      }
      overlay.querySelector('#dtmStartupFailureDetail').textContent = message;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        // Initialize Desktop Engine
        await window.dtmEngine.init();

        // Initialize Skin Manager
        await window.dtmSkinManager.init();

        // Initialize Era Switcher UI
        window.dtmSwitcherUI.init();

        // Load (and verify) the active skin
        const mounted = await window.dtmSkinManager.mountActiveSkin();
        if (!mounted) {
          console.error('[DTM] Startup skin could not be mounted.');
          showStartupFailure('No desktop skin could be loaded. Check the installed skins and try again.');
        }
        // Ensure shell components (Discord, browser windows) know the active skin for correct chrome
        window.dtmSkinManager.emitInitialSkinChanged();
      } catch (error) {
        console.error('[DTM] Startup failed:', error);
        showStartupFailure(error && error.message ? error.message : String(error));
      }
    });

    // Provide keyboard shortcut forwarding from within iframes
    window.addEventListener('message', (event) => {
      if (event.data === 'dtm:open-switcher') {
        window.dtmSwitcherUI.open();
      }
    });
  </script>
</body>
</html>
